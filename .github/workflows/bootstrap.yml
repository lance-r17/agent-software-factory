name: Bootstrap site source and first Pages deploy

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/READY'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble and verify source tarball
        run: |
          cat .bootstrap/chunk-complete > /tmp/site.b64
          base64 -d /tmp/site.b64 > /tmp/site.tar.gz
          tar -tzf /tmp/site.tar.gz > /dev/null
          mkdir -p /tmp/site
          tar -xzf /tmp/site.tar.gz -C /tmp/site

      - name: Install site source into repository
        run: |
          rsync -a --exclude='.git' --exclude='.bootstrap' /tmp/site/ .
          git rm -rq --ignore-unmatch .bootstrap .github/workflows/bootstrap.yml

      - name: Commit site source (idempotent)
        run: |
          git config user.name 'agent-factory-bootstrap'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m '导入 Agent 软件工厂站点完整源码（含 Pages 工作流）'
          git pull --rebase origin main
          git push

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
